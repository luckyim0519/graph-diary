# Life Assistant configuration.
# fx: conversion rates INTO CAD (1 unit of currency = N CAD). Update by hand
# when they drift; each generated review records the rates it used.
fx:
  USD: 1.36
  KRW: 0.00099
model: claude-sonnet-4-6
# Exercise type chips shown in the Habits UI (user-editable; free text also allowed)
exercise_types: [Pilates, Gym, Band Stretching, Swimming, Kayaking, Walk, Run, Other]
# vault: override the default vault location if needed (supports leading ~)
# vault: ~/Library/Application Support/graph-diary/vault
