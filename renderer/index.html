<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' vault:;" />
    <title>Graph Diary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Sidebar: categories and notes -->
      <aside id="sidebar">
        <div class="sidebar-head">
          <h1>📓 Graph Diary</h1>
        </div>
        <div class="sidebar-actions">
          <button id="new-note-btn" title="New note">+ Note</button>
          <button id="new-cat-btn" title="New category">+ Category</button>
        </div>
        <div class="sidebar-search">
          <input id="search-input" type="text" placeholder="🔍 Search notes… (Cmd+F)" />
        </div>
        <div id="tree"></div>
        <div class="sidebar-foot">
          <span id="vault-path" title=""></span>
          <div class="backup-row">
            <button id="backup-btn" title="Back up vault to Seagate drive">⇪ Back up</button>
            <span id="backup-status"></span>
          </div>
        </div>
      </aside>

      <!-- Main pane: editor or graph -->
      <main id="main">
        <header id="toolbar">
          <div class="tabs">
            <button id="tab-editor" class="tab active">✎ Editor</button>
            <button id="tab-graph" class="tab">🕸 Graph</button>
            <button id="tab-posts" class="tab">▦ Posts</button>
          </div>
          <div class="tool-right">
            <span id="save-state"></span>
            <button id="delete-note-btn" title="Delete current note">🗑</button>
          </div>
        </header>

        <!-- Editor view -->
        <section id="editor-view" class="view">
          <div id="note-meta">
            <span id="note-title">No note selected</span>
            <span id="note-year" class="pill pill-year"></span>
            <span id="note-cat" class="pill"></span>
            <span class="theme-field">
              <label for="note-year-input">📅 Year</label>
              <input id="note-year-input" type="number" min="1900" max="2100" step="1" placeholder="2026" />
            </span>
            <span class="theme-field">
              <label for="note-theme">🏷 Theme</label>
              <input id="note-theme" list="theme-list" placeholder="e.g. canada" />
              <datalist id="theme-list"></datalist>
            </span>
            <span class="theme-field">
              <label for="note-subtheme">↳ Sub-theme</label>
              <input id="note-subtheme" list="subtheme-list" placeholder="e.g. PEY" />
              <datalist id="subtheme-list"></datalist>
            </span>
          </div>
          <div id="note-keywords" title="Auto-summarized keywords (written to the file header)"></div>
          <div id="editor-split">
            <div id="editor-pane">
              <div id="editor-wrap">
                <textarea
                  id="editor"
                  spellcheck="true"
                  placeholder="Start writing… use [[Note Name]] to link to another note."
                ></textarea>
                <div id="autocomplete" class="hidden"></div>
              </div>
            </div>
            <div id="split-handle" title="Drag to resize"></div>
            <div id="preview-pane">
              <div id="preview"></div>
            </div>
          </div>
          <div id="mentions-panel">
            <div class="mentions-head" id="linked-mentions-head">
              <span class="mentions-arrow" id="linked-mentions-arrow">▾</span>
              Linked mentions (<span id="linked-count">0</span>)
            </div>
            <div class="mentions-list" id="linked-mentions-list"></div>
            <div class="mentions-head" id="unlinked-mentions-head">
              <span class="mentions-arrow" id="unlinked-mentions-arrow">▾</span>
              Unlinked mentions (<span id="unlinked-count">0</span>)
            </div>
            <div class="mentions-list" id="unlinked-mentions-list"></div>
          </div>
        </section>

        <!-- Graph view -->
        <section id="graph-view" class="view hidden">
          <canvas id="graph-canvas"></canvas>
          <div id="graph-legend"></div>
        </section>

        <!-- Posts feed view -->
        <section id="posts-view" class="view hidden">
          <div id="posts-toolbar-row">
            <div id="posts-filter-bar"></div>
            <div id="posts-mode-switch">
              <button id="posts-mode-feed" class="mode-btn" title="Feed view">☰</button>
              <button id="posts-mode-grid" class="mode-btn" title="Grid view">⊞</button>
            </div>
          </div>
          <div id="posts-content">
            <div id="posts-feed"></div>
            <div id="posts-grid" class="hidden"></div>
          </div>
        </section>

        <!-- Lightbox -->
        <div id="lightbox" class="hidden">
          <div id="lightbox-scrim"></div>
          <button id="lightbox-prev" class="lightbox-nav">&#8249;</button>
          <img id="lightbox-img" alt="">
          <button id="lightbox-next" class="lightbox-nav">&#8250;</button>
          <div id="lightbox-footer">
            <button id="lightbox-open-note" class="lightbox-open-btn">✎ 열기</button>
          </div>
        </div>
      </main>
    </div>

    <!-- Lightweight modal -->
    <div id="modal" class="hidden">
      <div class="modal-box">
        <h3 id="modal-title"></h3>
        <select id="modal-select" class="hidden"></select>
        <input id="modal-input" type="text" />
        <div class="modal-actions">
          <button id="modal-cancel">Cancel</button>
          <button id="modal-ok" class="primary">OK</button>
        </div>
      </div>
    </div>

    <!-- Quick switcher (Cmd+O / Cmd+P) -->
    <div id="quick-switcher" class="hidden">
      <div id="qs-scrim"></div>
      <div class="qs-box">
        <input id="qs-input" type="text" placeholder="Jump to note…" />
        <div id="qs-results"></div>
      </div>
    </div>

    <script src="graph.js"></script>
    <script src="app.js"></script>
    <script src="posts.js"></script>
  </body>
</html>
