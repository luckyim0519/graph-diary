<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' vault:;" />
    <title>Graph Diary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Sidebar: categories and notes -->
      <aside id="sidebar">
        <div class="sidebar-head">
          <h1>📓 Graph Diary</h1>
        </div>
        <div class="sidebar-actions">
          <button id="new-note-btn" title="New note">+ Note</button>
          <button id="new-cat-btn" title="New category">+ Category</button>
        </div>
        <div class="sidebar-actions" id="assistant-actions">
          <button id="journal-btn" title="Create today's journal entry">📓 오늘 일기</button>
          <button id="logs-btn" title="Create this week's exercise/study logs">🏃 주간 로그</button>
          <button id="review-btn" title="Generate weekly/monthly review">🧾 리뷰</button>
        </div>
        <div id="tree"></div>
        <div class="sidebar-foot">
          <span id="vault-path" title=""></span>
          <div class="backup-row">
            <button id="backup-btn" title="Back up vault to Seagate drive">⇪ Back up</button>
            <span id="backup-status"></span>
          </div>
        </div>
      </aside>

      <!-- Main pane: editor or graph -->
      <main id="main">
        <header id="toolbar">
          <div class="tabs">
            <button id="tab-editor" class="tab active">✎ Editor</button>
            <button id="tab-graph" class="tab">🕸 Graph</button>
            <button id="tab-posts" class="tab">▦ Posts</button>
            <button id="tab-habits" class="tab">✅ Habits</button>
          </div>
          <div class="tool-right">
            <span id="save-state"></span>
            <button id="delete-note-btn" title="Delete current note">🗑</button>
          </div>
        </header>

        <!-- Editor view -->
        <section id="editor-view" class="view">
          <div id="note-meta">
            <span id="note-title">No note selected</span>
            <span id="note-year" class="pill pill-year"></span>
            <span id="note-cat" class="pill"></span>
            <span class="theme-field">
              <label for="note-year-input">📅 Year</label>
              <input id="note-year-input" type="number" min="1900" max="2100" step="1" placeholder="2026" />
            </span>
            <span class="theme-field">
              <label for="note-theme">🏷 Theme</label>
              <input id="note-theme" list="theme-list" placeholder="e.g. canada" />
              <datalist id="theme-list"></datalist>
            </span>
            <span class="theme-field">
              <label for="note-subtheme">↳ Sub-theme</label>
              <input id="note-subtheme" list="subtheme-list" placeholder="e.g. PEY" />
              <datalist id="subtheme-list"></datalist>
            </span>
          </div>
          <div id="note-keywords" title="Auto-summarized keywords (written to the file header)"></div>
          <div id="editor-split">
            <div id="editor-pane">
              <div id="editor-wrap">
                <textarea
                  id="editor"
                  spellcheck="true"
                  placeholder="Start writing… use [[Note Name]] to link to another note."
                ></textarea>
                <div id="autocomplete" class="hidden"></div>
              </div>
            </div>
            <div id="split-handle" title="Drag to resize"></div>
            <div id="preview-pane">
              <div id="preview"></div>
            </div>
          </div>
        </section>

        <!-- Graph view -->
        <section id="graph-view" class="view hidden">
          <canvas id="graph-canvas"></canvas>
          <div id="graph-legend"></div>
        </section>

        <!-- Habits view: check-off logging + coloring heatmaps -->
        <section id="habits-view" class="view hidden">
          <div id="habits-scroll">
            <div class="habit-section" id="habit-exercise">
              <h2>🏃 운동</h2>
              <div class="habit-progress"><div class="hp-bar"><div class="hp-fill"></div></div><span class="hp-label"></span></div>
              <div class="habit-heatmap"></div>
              <form class="habit-form">
                <div class="hf-row hf-date-row">
                  <input type="date" class="hf-date" />
                  <span class="hf-hint">칸을 클릭하면 그 날짜로 기록해요</span>
                </div>
                <div class="hf-chips"></div>
                <div class="hf-row">
                  <input type="number" class="hf-minutes" min="1" max="600" placeholder="분" required />
                  <label>강도 <select class="hf-intensity"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
                  <label>컨디션 <select class="hf-feel"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
                  <input type="text" class="hf-detail" placeholder="메모 (선택)" />
                  <button type="submit" class="hf-save">✓ 기록</button>
                </div>
              </form>
            </div>
            <div class="habit-section" id="habit-study">
              <h2>📚 공부</h2>
              <div class="habit-progress"><div class="hp-bar"><div class="hp-fill"></div></div><span class="hp-label"></span></div>
              <div class="habit-heatmap"></div>
              <form class="habit-form">
                <div class="hf-row hf-date-row">
                  <input type="date" class="hf-date" />
                  <span class="hf-hint">칸을 클릭하면 그 날짜로 기록해요</span>
                </div>
                <div class="hf-chips"></div>
                <div class="hf-row">
                  <input type="text" class="hf-area" placeholder="분야 (새 분야 입력 가능)" />
                  <input type="number" class="hf-minutes" min="1" max="600" placeholder="분" required />
                  <label>깊이 <select class="hf-depth"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
                  <label class="hf-output-label"><input type="checkbox" class="hf-output" /> 산출물</label>
                  <input type="text" class="hf-detail" placeholder="뭘 공부했나요" />
                  <button type="submit" class="hf-save">✓ 기록</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <!-- Posts feed view -->
        <section id="posts-view" class="view hidden">
          <div id="posts-toolbar-row">
            <div id="posts-filter-bar"></div>
            <div id="posts-mode-switch">
              <button id="posts-mode-feed" class="mode-btn" title="Feed view">☰</button>
              <button id="posts-mode-grid" class="mode-btn" title="Grid view">⊞</button>
            </div>
          </div>
          <div id="posts-content">
            <div id="posts-feed"></div>
            <div id="posts-grid" class="hidden"></div>
          </div>
        </section>

        <!-- Lightbox -->
        <div id="lightbox" class="hidden">
          <div id="lightbox-scrim"></div>
          <button id="lightbox-prev" class="lightbox-nav">&#8249;</button>
          <img id="lightbox-img" alt="">
          <button id="lightbox-next" class="lightbox-nav">&#8250;</button>
          <div id="lightbox-footer">
            <button id="lightbox-open-note" class="lightbox-open-btn">✎ 열기</button>
          </div>
        </div>
      </main>
    </div>

    <!-- Lightweight modal -->
    <div id="modal" class="hidden">
      <div class="modal-box">
        <h3 id="modal-title"></h3>
        <select id="modal-select" class="hidden"></select>
        <input id="modal-input" type="text" />
        <div class="modal-actions">
          <button id="modal-cancel">Cancel</button>
          <button id="modal-ok" class="primary">OK</button>
        </div>
      </div>
    </div>

    <script src="graph.js"></script>
    <script src="app.js"></script>
    <script src="posts.js"></script>
    <script src="habits.js"></script>
  </body>
</html>
